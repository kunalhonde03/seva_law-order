version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: surakshavani-db
    environment:
      POSTGRES_USER: sv_user
      POSTGRES_PASSWORD: sv_password
      POSTGRES_DB: surakshavani_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sv_user -d surakshavani_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surakshavani-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surakshavani-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://sv_user:sv_password@db:5432/surakshavani_db
      REDIS_URL: redis://redis:6379/0
      HMAC_PEPPER: surakshavani-pepper-for-blind-indexing-2026-secret
      FIELD_ENCRYPTION_KEY: 7V8x9Z1A2B3C4D5E6F7G8H9I0J1K2L3M4N5O6P7Q8R9=
      ASR_PROVIDER: mock
      LLM_PROVIDER: recorded
    ports:
      - "8000:8000"

volumes:
  pgdata:
